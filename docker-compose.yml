services:
  postgres:
    image: postgres:16-alpine
    container_name: quantity-postgres
    environment:
      POSTGRES_DB: ${QMA_DB_NAME}
      POSTGRES_USER: ${QMA_DB_USER}
      POSTGRES_PASSWORD: ${QMA_DB_PASSWORD}
      TZ: UTC
    ports:
      - "${QMA_POSTGRES_HOST_PORT}:${QMA_POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./complete-database-setup.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${QMA_DB_USER} -d ${QMA_DB_NAME}
      interval: ${QMA_HEALTHCHECK_INTERVAL}
      timeout: ${QMA_HEALTHCHECK_TIMEOUT}
      retries: ${QMA_HEALTHCHECK_RETRIES}
      start_period: ${QMA_POSTGRES_HEALTHCHECK_START_PERIOD}
    restart: unless-stopped
    networks:
      quantity-network:
        aliases:
          - postgres
          - quantity-db

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
      args:
        MAVEN_BUILDER_IMAGE: ${QMA_MAVEN_BUILDER_IMAGE}
        JAVA_RUNTIME_IMAGE: ${QMA_JAVA_RUNTIME_IMAGE}
        APP_USER_ID: ${QMA_APP_USER_ID}
        SERVICE_PORT: ${QMA_EUREKA_SERVICE_PORT}
    image: sanyamodi/eureka-server:latest
    container_name: quantity-eureka-server
    environment:
      JAVA_OPTS: ${QMA_EUREKA_JAVA_OPTS}
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: ${QMA_EUREKA_SERVICE_PORT}
    ports:
      - "${QMA_EUREKA_HOST_PORT}:${QMA_EUREKA_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:${QMA_EUREKA_SERVICE_PORT}/actuator/health
      interval: ${QMA_HEALTHCHECK_INTERVAL}
      timeout: ${QMA_HEALTHCHECK_TIMEOUT}
      retries: ${QMA_HEALTHCHECK_RETRIES}
      start_period: ${QMA_APP_HEALTHCHECK_START_PERIOD}
    restart: unless-stopped
    networks:
      quantity-network:
        aliases:
          - eureka-server
          - service-registry

  measurement-service:
    build:
      context: ./measurement-service
      dockerfile: Dockerfile
      args:
        MAVEN_BUILDER_IMAGE: ${QMA_MAVEN_BUILDER_IMAGE}
        JAVA_RUNTIME_IMAGE: ${QMA_JAVA_RUNTIME_IMAGE}
        APP_USER_ID: ${QMA_APP_USER_ID}
        SERVICE_PORT: ${QMA_MEASUREMENT_SERVICE_PORT}
    image: sanyamodi/measurement-service:latest
    container_name: quantity-measurement-service
    environment:
      JAVA_OPTS: ${QMA_MEASUREMENT_JAVA_OPTS}
      SPRING_APPLICATION_NAME: measurement-service
      SERVER_PORT: ${QMA_MEASUREMENT_SERVICE_PORT}
      EUREKA_DEFAULT_ZONE: ${QMA_EUREKA_DEFAULT_ZONE}
      DATABASE_URL: ${QMA_DATABASE_URL}
      DATABASE_USERNAME: ${QMA_DATABASE_USERNAME}
      DATABASE_PASSWORD: ${QMA_DATABASE_PASSWORD}
      SPRING_DATASOURCE_URL: ${QMA_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${QMA_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${QMA_DATABASE_PASSWORD}
      JWT_SECRET: ${QMA_JWT_SECRET}
    ports:
      - "${QMA_MEASUREMENT_HOST_PORT}:${QMA_MEASUREMENT_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:${QMA_MEASUREMENT_SERVICE_PORT}/actuator/health
      interval: ${QMA_HEALTHCHECK_INTERVAL}
      timeout: ${QMA_HEALTHCHECK_TIMEOUT}
      retries: ${QMA_HEALTHCHECK_RETRIES}
      start_period: ${QMA_APP_HEALTHCHECK_START_PERIOD}
    restart: unless-stopped
    networks:
      quantity-network:
        aliases:
          - measurement-service
          - measurement-api

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
      args:
        MAVEN_BUILDER_IMAGE: ${QMA_MAVEN_BUILDER_IMAGE}
        JAVA_RUNTIME_IMAGE: ${QMA_JAVA_RUNTIME_IMAGE}
        APP_USER_ID: ${QMA_APP_USER_ID}
        SERVICE_PORT: ${QMA_USER_SERVICE_PORT}
    image: sanyamodi/user-service:latest
    container_name: quantity-user-service
    environment:
      JAVA_OPTS: ${QMA_USER_JAVA_OPTS}
      SPRING_APPLICATION_NAME: user-service
      SERVER_PORT: ${QMA_USER_SERVICE_PORT}
      EUREKA_DEFAULT_ZONE: ${QMA_EUREKA_DEFAULT_ZONE}
      DATABASE_URL: ${QMA_DATABASE_URL}
      DATABASE_USERNAME: ${QMA_DATABASE_USERNAME}
      DATABASE_PASSWORD: ${QMA_DATABASE_PASSWORD}
      SPRING_DATASOURCE_URL: ${QMA_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${QMA_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${QMA_DATABASE_PASSWORD}
      JWT_SECRET: ${QMA_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${QMA_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${QMA_GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${QMA_GOOGLE_REDIRECT_URI}
      APP_REDIRECT_URI: ${QMA_APP_REDIRECT_URI}
      CORS_ALLOWED_ORIGINS: ${QMA_CORS_ALLOWED_ORIGINS}
    ports:
      - "${QMA_USER_HOST_PORT}:${QMA_USER_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:${QMA_USER_SERVICE_PORT}/actuator/health
      interval: ${QMA_HEALTHCHECK_INTERVAL}
      timeout: ${QMA_HEALTHCHECK_TIMEOUT}
      retries: ${QMA_HEALTHCHECK_RETRIES}
      start_period: ${QMA_APP_HEALTHCHECK_START_PERIOD}
    restart: unless-stopped
    networks:
      quantity-network:
        aliases:
          - user-service
          - identity-service

  admin-server:
    build:
      context: ./admin-server
      dockerfile: Dockerfile
      args:
        MAVEN_BUILDER_IMAGE: ${QMA_MAVEN_BUILDER_IMAGE}
        JAVA_RUNTIME_IMAGE: ${QMA_JAVA_RUNTIME_IMAGE}
        APP_USER_ID: ${QMA_APP_USER_ID}
        SERVICE_PORT: ${QMA_ADMIN_SERVICE_PORT}
    image: sanyamodi/admin-server:latest
    container_name: quantity-admin-server
    environment:
      JAVA_OPTS: ${QMA_ADMIN_JAVA_OPTS}
      SPRING_APPLICATION_NAME: admin-server
      SERVER_PORT: ${QMA_ADMIN_SERVICE_PORT}
      EUREKA_DEFAULT_ZONE: ${QMA_EUREKA_DEFAULT_ZONE}
    ports:
      - "${QMA_ADMIN_HOST_PORT}:${QMA_ADMIN_SERVICE_PORT}"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:${QMA_ADMIN_SERVICE_PORT}/actuator/health
      interval: ${QMA_HEALTHCHECK_INTERVAL}
      timeout: ${QMA_HEALTHCHECK_TIMEOUT}
      retries: ${QMA_HEALTHCHECK_RETRIES}
      start_period: ${QMA_APP_HEALTHCHECK_START_PERIOD}
    restart: unless-stopped
    networks:
      quantity-network:
        aliases:
          - admin-server
          - monitoring-service

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      args:
        MAVEN_BUILDER_IMAGE: ${QMA_MAVEN_BUILDER_IMAGE}
        JAVA_RUNTIME_IMAGE: ${QMA_JAVA_RUNTIME_IMAGE}
        APP_USER_ID: ${QMA_APP_USER_ID}
        SERVICE_PORT: ${QMA_GATEWAY_SERVICE_PORT}
    image: sanyamodi/api-gateway:latest
    container_name: quantity-api-gateway
    environment:
      JAVA_OPTS: ${QMA_GATEWAY_JAVA_OPTS}
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: ${QMA_GATEWAY_SERVICE_PORT}
      EUREKA_DEFAULT_ZONE: ${QMA_EUREKA_DEFAULT_ZONE}
    ports:
      - "${QMA_GATEWAY_HOST_PORT}:${QMA_GATEWAY_SERVICE_PORT}"
    depends_on:
      eureka-server:
        condition: service_healthy
      measurement-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:${QMA_GATEWAY_SERVICE_PORT}/actuator/health
      interval: ${QMA_HEALTHCHECK_INTERVAL}
      timeout: ${QMA_HEALTHCHECK_TIMEOUT}
      retries: ${QMA_HEALTHCHECK_RETRIES}
      start_period: ${QMA_APP_HEALTHCHECK_START_PERIOD}
    restart: unless-stopped
    networks:
      quantity-network:
        aliases:
          - api-gateway
          - gateway

  frontend:
    build:
      context: ../QuantityMeasurementAppFrontend
      dockerfile: Dockerfile
    image: sanyamodi/frontend:latest
    container_name: quantity-frontend
    ports:
      - "${QMA_FRONTEND_HOST_PORT}:${QMA_FRONTEND_CONTAINER_PORT}"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1/
      interval: ${QMA_HEALTHCHECK_INTERVAL}
      timeout: ${QMA_HEALTHCHECK_TIMEOUT}
      retries: ${QMA_HEALTHCHECK_RETRIES}
      start_period: ${QMA_FRONTEND_HEALTHCHECK_START_PERIOD}
    restart: unless-stopped
    networks:
      quantity-network:
        aliases:
          - frontend
          - web-app

networks:
  quantity-network:
    name: ${QMA_DOCKER_NETWORK_NAME}
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${QMA_DOCKER_NETWORK_SUBNET}

volumes:
  postgres_data:
    name: ${QMA_POSTGRES_VOLUME_NAME}
